[project]
name = "amor"
version = "0.5.0"
description = "A package manager for Love2D"
readme = "README.md"
authors = [
    { name = "snailcreature" }
]
requires-python = ">=3.14"
dependencies = [
    "gitpython==3.1.*,>=3.1.44",
    "luaparser==4.1.*,>=4.1.0",
    "lupa==2.8.*,>=2.8.0",
    "toml==0.10.*,>=0.10.2",
    "typer==0.27.*,>=0.27.0",
    "types-lupa==2.6.*,>=2.6.0",
]

[project.scripts]
amor = "amor.main:app"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "1 week"
